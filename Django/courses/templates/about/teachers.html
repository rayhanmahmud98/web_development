<!DOCTYPE html>
<html>
<head>
    <title>Our Teachers</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        
        h1 {
            text-align: center;
            color: #333;
        }
        
        .teacher-card {
            background: white;
            padding: 15px;
            margin: 15px auto;
            width: 300px;
            border-radius: 10px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
            text-align: center;
        }
        
        .teacher-card h3 {
            color: #007bff;
            margin: 10px 0;
        }
        
        .teacher-card p {
            color: #666;
            margin: 5px 0;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }
    </style>
</head>
<body>
    <h1>Our Teachers</h1>
    
    <div class="container">
        <div class="teacher-card">
            <h3>Dr. Amisha Siddika</h3>
            <p>Deep Learning Expert</p>
            <p>PhD in Headache</p>
        </div>
        
        <div class="teacher-card">
            <h3>Prof. DR Hannan ALI</h3>
            <p>Machine Learning</p>
            <p>15+ years experience</p>
        </div>
        
        <div class="teacher-card">
            <h3>Dr Adolf Hitler</h3>
            <p>Painter</p>
            <p>Former Fuhrer</p>
        </div>
    </div>
</body>
</html>
